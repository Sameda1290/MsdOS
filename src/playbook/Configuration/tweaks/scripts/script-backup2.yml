---
title: Backup MsdOS Services and Drivers
description: Backs up default MsdOS services and drivers, after all the tweaks are finished
actions:
  - !powerShell:
    command: >-
      .\BACKUP.ps1 -FilePath """$([Environment]::GetFolderPath('Windows'))\MsdOSModules\Other\atlasServices.reg"""
    wait: true
    exeDir: true
